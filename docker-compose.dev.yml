services:
  postgres:
    container_name: craftplan-postgres
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=craftplan_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./.postgres:/var/lib/postgresql/data:Z
  minio:
    container_name: craftplan-minio
    build:
      context: .
      dockerfile: Dockerfile.storage
    ports:
      - "${S3_PORT:-9000}:9000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_BUCKET: craftplan
    volumes:
      - .seaweedfs:/data:Z
      - .minio:/legacy:ro,z
    networks:
      default:
        aliases: [seaweedfs]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: "${STORAGE_START_PERIOD:-24h}"
  mailpit:
    container_name: craftplan-mailpit
    image: axllent/mailpit
    ports:
      - 1025:1025
      - 8025:8025
