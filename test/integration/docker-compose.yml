services:
  seaweedfs:
    image: ${CRAFTPLAN_STORAGE_IMAGE:-craftplan-storage:test}
    entrypoint: [weed]
    command: mini -dir=/data -s3.port=9000 -ip=127.0.0.1 -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      S3_BUCKET: "${AWS_S3_BUCKET}"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/readyz"]
      interval: 1s
      timeout: 5s
      retries: 60
    ports: !override
      - "127.0.0.1::9000"
  minio:
    image: ${MINIO_TEST_IMAGE:-cgr.dev/chainguard/minio@sha256:0dab2f9fee1c1139ae8753b5e35bb4461af2a276cfe0923a2504c75a6170bc64}
    command: server /data
    environment:
      MINIO_ROOT_USER: migration-user
      MINIO_ROOT_PASSWORD: migration-secret
    ports:
      - "127.0.0.1::9000"
    volumes:
      - legacy_data:/data
  storage-migrate:
    extends:
      file: ../../docker-compose.storage-migration.yml
      service: storage-migrate
    depends_on: !override
      seaweedfs:
        condition: service_healthy
volumes:
  seaweedfs_data:
  legacy_data:
