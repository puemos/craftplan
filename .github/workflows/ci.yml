name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix build tools
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Run application checks
        run: mise run ci

      - name: Install image tools for real storage integration
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Test SeaweedFS and MinIO migration
        run: mise run test:storage
