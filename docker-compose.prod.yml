services:
  craftplan:
    build: .
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file: .env
    environment:
      DATABASE_URL: "ecto://postgres:${POSTGRES_PASSWORD}@postgres/craftplan"
      AWS_S3_SCHEME: "${AWS_S3_SCHEME:-http://}"
      AWS_S3_HOST: "${AWS_S3_HOST:-seaweedfs}"
      AWS_S3_PORT: "${AWS_S3_PORT:-9000}"
      AWS_S3_PUBLIC_URL: "${AWS_S3_PUBLIC_URL:-http://${HOST:-localhost}:9000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-craftplan}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: craftplan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: Dockerfile.storage
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_BUCKET: "${AWS_S3_BUCKET:-craftplan}"
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - seaweedfs_data:/data
      - minio_data:/legacy:ro
    networks:
      default:
        aliases: [seaweedfs]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: "${STORAGE_START_PERIOD:-24h}"
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
  minio_data:
